# ============================================================================
# Loon 全功能主配置 · 去广告 + 分流 + 插件自动加载
# ----------------------------------------------------------------------------
# 一键导入公开版：46 个可用插件在该文件内自动加载，无需逐个安装。
# 公开版【不含】节点、订阅链接、证书私钥/口令；[Proxy Group] 全部为 DIRECT。
# 你已有订阅/证书时不要直接覆盖当前配置，先用
#   python3 tools/make-private-config.py --lcf <你的 Loon 备份.lcf>
# 生成含节点与本机 CA 的私有配置，再在 Loon 中导入该文件。
#
# 导入后 Loon 会提示替换当前配置；先确认已有备份。MITM 类插件需要
# 在 Loon 中生成并安装证书后才会解密；银行/支付/微信等证书固定域已排除。
#
# 规则来源：当前使用的 492 条分流规则 + 新增 DEST-PORT,784(DoQ)。
# 插件顺序 = 规则优先级顺序：共享广告/DNS 层 → 本仓 App 层 → 第三方 App 层。
# 2026-10-30 实测剔除 2 个失效插件 URL（见 [Plugin] 段注释）。
#
# DNS：使用域名形式 DoH/DoH3。ads 2.8.0 已把国内公共 DoH 入口从默认
# [Host] 拦截移入默认注释组，因此不会再黑洞 Loon 自己的加密 DNS。若你手动
# 启用 ads 的 doh_public_cn 可选组，必须把下方 doh/doh3 改为 IP 形式。
# DoQ 默认关闭：真机日志 5,239 次建立中 5,236 次失败；DoH/DoH3 已覆盖。
# ============================================================================

[General]
# --- IP 栈：只走 IPv4，从源头消除 AAAA/Fake IP 旁路 ------------------------
ip-mode = v4-only
interface-mode = auto
ipv6-vif = off

# --- DNS：域内 DoH/DoH3 加密优先，UDP 作为兜底 -----------------------------
dns-server = 180.184.11.11,180.184.22.22,119.29.29.29,223.5.5.5
doh-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query
doh3-server = h3://dns.alidns.com/dns-query,h3://doh.pub/dns-query
# doq-server = quic://dns.alidns.com:853
# 所有目标的 53 端口都由 Loon 接管；局域网 DNS 已在 bypass-tun 中绕过。
hijack-dns = *:53
domain-reject-mode = DNS
dns-reject-mode = LoopbackIP

# --- STUN / UDP ------------------------------------------------------------
# STUN 在 [Rule] 里用 PROTOCOL,STUN,REJECT 阻断；disable-stun 保持官方默认。
disable-stun = false
# 节点不支持 UDP 时宁可失败也不回退 DIRECT（防止真实 IP 泄漏）。
# 直连版不会触发；私有配置有节点时请确认节点已开 UDP。
udp-fallback-mode = REJECT

# --- 系统服务拿真实 IP，避免 Fake IP 被缓存 --------------------------------
# *.icloud.com 来自官方 example.conf：CloudKit/钥匙串等会缓存 Fake IP；
# 不要扩成 *.apple.com，那会连带放行 ca.iadsdk.apple.com 这类广告主机。
real-ip = *.cmpassport.com,*.jegotrip.com.cn,id6.me,*.boc.cn,*.abchina.com,*.ccb.com,*.psbc.com,*.cmbchina.com,*.icbc.com.cn,*.bankofchina.com,*.spdb.com.cn,*.cib.com.cn,*.cebbank.com,*.unionpay.com,*.pingan.com.cn,*.pingan.com,*.bankcomm.com,*.citicbank.com,*.hxb.com.cn,*.cgbchina.com.cn,*.push.apple.com,*.apns.apple.com,captive.apple.com,*.icloud.com,*.local,*.lan,*.home.arpa,*.srv.nintendo.net,*.stun.playstation.net,xbox.*.microsoft.com,*.xboxlive.com,stun.*,*.msftconnecttest.com,*.msftncsi.com,*.battlenet.com.cn,time.*.com

# --- 局域网 / 私网绕过 TUN 与 HTTP Proxy -----------------------------------
# 保留地址段与官方 example.conf 对齐：192.0.0.0/24、192.0.2.0/24、
# 192.88.99.0/24、198.18.0.0/15、198.51.100.0/24、203.0.113.0/24 都是
# 保留/文档/基准测试网段，误入 TUN 只会制造无谓的代理连接。
skip-proxy = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,::1/128,fc00::/7,fe80::/10,ff00::/8,localhost,*.local,*.lan,*.home.arpa
bypass-tun = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,::1/128,fc00::/7,fe80::/10,ff00::/8,localhost,*.local,*.lan,*.home.arpa

# --- GeoIP 数据源与探活 -----------------------------------------------------
geoip-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
test-timeout = 5
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
proxy-test-url = http://connectivitycheck.gstatic.com/generate_204

# --- 局域网代理入口（默认关闭） --------------------------------------------
allow-wifi-access = false
wifi-access-http-port = 7222
wifi-access-socks5-port = 6225

# --- App 导出的未文档化键：保留但标注，不以此作为官方依据 -------------------
# sni-sniffing 不在现行官方《通用配置》参数表内；来自当前 Loon 导出配置。
# 若升级后出现解析/连接异常，先删这一行。
sni-sniffing = true

[Host]
# 有意留空：去广告 Host 黑洞由 ads.plugin 统一承担；主配置再写 server:
# 会把加密 DNS 降级成明文，且 Host 规则与插件规则可能重复。
# 需要按域指定解析器时，正确形态是：example.com = server:https://223.5.5.5/dns-query

[Proxy]
# 公开配置不含节点。私有配置由 tools/make-private-config.py 注入。

[Proxy Group]
# 公开版没有节点，所有组都收敛到 DIRECT；导入后可在 Loon 里改组成员。
# 私有配置会整体替换本段为用户当前的真实策略组。
Proxy = select,DIRECT
Fallback = select,DIRECT
Apple = select,DIRECT
Final = select,DIRECT
Streaming = select,DIRECT
AI = select,DIRECT
Developer = select,DIRECT
Gaming = select,DIRECT
Social = select,DIRECT
OpenCode = select,DIRECT

