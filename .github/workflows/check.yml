name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check
      - name: Verify minified scripts are committed
        run: test -z "$(git status --porcelain -- plugins/)"
