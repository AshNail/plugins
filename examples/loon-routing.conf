# ============================================================================
# Loon 分流顺序示例（direct-only 实验配置）
# ----------------------------------------------------------------------------
# 这份文件不是日常配置，也不替代 examples/loon.conf：
# 它的用途是让 Loon 日志里出现「域名规则 → 解析 DNS → ASN → GEOIP → FINAL」
# 的完整顺序，方便对照 docs/loon-routing-host-asn.md。
#
# 注意：IP-ASN / GEOIP 是 IP 规则，域名请求会先触发 DNS 解析；所有策略都是
# DIRECT，所以不会把流量送错节点。把 DIRECT 换成你的策略组名即可，但请保留
# 规则顺序，并先删除你原有 [Rule] 的 FINAL——Loon 只允许一条且必须最后。
# ============================================================================

[General]
# 只影响 A/AAAA 的选择顺序，不改变分流结果。
ip-mode = prefer-v4

[Rule]
# 1. 域名规则先匹配：命中后不再解析 DNS，后面的 IP 规则也看不到它。
DOMAIN-SUFFIX,example.cn,DIRECT

# 2. 域名未命中 → Loon 解析 DNS → 按 ASN 匹配。
#    这里故意不写 no-resolve：no-resolve 只匹配「目标已经是 IP」的请求。
IP-ASN,4134,DIRECT

# 3. 再按国家/地区兜底。
GEOIP,CN,DIRECT

# 4. 端口级封堵：标准 DoT/DoQ 端口。
DEST-PORT,853,REJECT

# 5. FINAL 唯一且最后。
FINAL,DIRECT
